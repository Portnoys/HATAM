<title>חת"מ — הערכה</title>
<script>
// ══ PWA: Inject manifest as blob ══
(function(){
  var manifest = {
    name: 'חת"מ — הערכה',
    short_name: 'חת"מ',
    description: 'מערכת הערכה קוגניטיבית',
    start_url: '.',
    display: 'standalone',
    orientation: 'portrait',
    background_color: '#f5f5f5',
    theme_color: '#1a3a5c',
    lang: 'he',
    dir: 'rtl',
    icons: [
      { src: _makeIcon(192, '#1a3a5c'), sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
      { src: _makeIcon(512, '#1a3a5c'), sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
    ]
  };
  function _makeIcon(size, color) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    ctx.fillStyle = color;
    ctx.fillRect(0,0,size,size);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold ' + Math.floor(size*0.38) + 'px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('חמ', size/2, size/2);
    return c.toDataURL('image/png');
  }
  // Replace icon src with real data-URIs
  manifest.icons.forEach(function(icon){ icon.src = _makeIcon(parseInt(icon.sizes), '#1a3a5c'); });
  var blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);
})();

// ══ PWA: Register Service Worker (inline blob) ══
(function(){
  if (!('serviceWorker' in navigator)) return;
  var swCode = [
    "var CACHE='hatam-v1';",
    "self.addEventListener('install',function(e){",
    "  e.waitUntil(caches.open(CACHE).then(function(c){",
    "    return c.addAll(['.','./']);",
    "  }));",
    "  self.skipWaiting();",
    "});",
    "self.addEventListener('activate',function(e){",
    "  e.waitUntil(clients.claim());",
    "});",
    "self.addEventListener('fetch',function(e){",
    "  e.respondWith(",
    "    caches.match(e.request).then(function(r){",
    "      return r || fetch(e.request).catch(function(){",
    "        return caches.match('.');",
    "      });",
    "    })",
    "  );",
    "});"
  ].join('\n');
  var swBlob = new Blob([swCode], {type:'text/javascript'});
  var swUrl = URL.createObjectURL(swBlob);
  navigator.serviceWorker.register(swUrl, {scope: './'})
    .then(function(){ console.log('[PWA] Service Worker registered'); })
    .catch(function(e){ console.warn('[PWA] SW registration failed:', e); });
})();
</script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: Arial, sans-serif; background: #f0f0f0; direction: rtl; overflow: hidden; width: 100vw; height: 100vh; }
.screen { display: none; width: 100vw; height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

/* ══ HOME ══ */
#s-home { align-items: center; justify-content: center; gap: 20px; background: #f5f5f5; padding: 24px; }
#s-home img.logo { max-height: 30vh; max-width: 75vw; object-fit: contain; }
.home-btns { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
.btn-home {
  border: none;
  border-radius: 22px;
  font-size: 26px;
  font-weight: bold;
  padding: 18px 46px;
  cursor: pointer;
  color: #7a1010;
  background: linear-gradient(180deg, #ffe0e0 0%, #ff9090 45%, #e85050 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -3px 0 rgba(0,0,0,.25) inset,
    0 6px 0 #a03030,
    0 8px 16px rgba(0,0,0,.28);
  text-shadow: 0 1px 1px rgba(255,255,255,.5);
  transition: transform .1s, box-shadow .1s;
  position: relative;
  top: 0;
}
.btn-home:hover {
  background: linear-gradient(180deg, #ffeaea 0%, #ff9f9f 45%, #f05555 100%);
}
.btn-home:active {
  transform: translateY(4px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,0,0,.2) inset,
    0 2px 0 #a03030,
    0 3px 8px rgba(0,0,0,.2);
  top: 4px;
}
.btn-home.green {
  color: #0a5a0a;
  background: linear-gradient(180deg, #e0ffe0 0%, #80e880 45%, #3ab83a 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -3px 0 rgba(0,0,0,.2) inset,
    0 6px 0 #1e7a1e,
    0 8px 16px rgba(0,0,0,.28);
  text-shadow: 0 1px 1px rgba(255,255,255,.5);
}
.btn-home.green:active {
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,0,0,.15) inset,
    0 2px 0 #1e7a1e,
    0 3px 8px rgba(0,0,0,.2);
}

/* ══ FORMS ══ */
.form-screen { background: #f5f5f5; overflow-y: auto; padding: 14px 20px 30px; }
.page-title { font-size: 28px; font-weight: bold; text-align: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #ddd; }
.field-row { display: flex; align-items: center; justify-content: flex-start; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; text-align: right; width: 100%; padding-right: 4px; }
.field-row label { font-size: 18px; font-weight: bold; white-space: nowrap; flex-shrink: 0; }
.field-row input, .field-row select, .field-row textarea {
  font-size: 18px; padding: 7px 12px; border: 1.5px solid #ccc; border-radius: 8px;
  background: white; direction: rtl; text-align: right;
}
.field-row select { min-width: 155px; }
.field-row input[type=text] { min-width: 150px; }
.field-row input[type=number] { width: 95px; }
.field-row textarea { min-width: 240px; resize: vertical; min-height: 56px; }
.field-row input.missing, .field-row select.missing, .field-row textarea.missing { border-color: #e53935 !important; background: #fff3f3 !important; }
.spacer { width: 18px; flex-shrink: 0; }

/* pic chooser */
.pic-strip { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; width: 100%; margin: 10px 0; }
.pic-card {
  position: relative;
  cursor: pointer;
  border-radius: 18px;
  border: 3px solid #e0e0e0;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 12px 24px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.10);
  flex: 0 0 auto;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.pic-card:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.10); }
.pic-card .pic-slice { width: 190px; height: 135px; background-repeat: no-repeat; }
.pic-card .pic-num { display: none; }
.pic-card .badge { display: none !important; }
.pic-card.sel-1 { border-color: #1565c0; transform: translateY(-2px) scale(1.04); }
.pic-card.sel-2 { border-color: #e65100; transform: translateY(-2px) scale(1.04); }
.pic-card.sel-1 .badge { display: flex; background: #1565c0; }
.pic-card.sel-2 .badge { display: flex; background: #e65100; }
.sel-status { font-size: 17px; font-weight: bold; text-align: center; color: #888; min-height: 24px; }

/* ══ QUESTION SCREEN ══ */
#s-question { background: #f5f5f5; display: flex; flex-direction: column; align-items: stretch; height: 100vh; }
.q-header { background: #1a3a5c; color: white; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.q-header .q-num { font-size: 16px; opacity: .8; }
.q-header .q-title { font-size: 18px; font-weight: bold; }
.q-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; gap: 16px; overflow-y: auto; }
.q-text { font-size: 48px; font-weight: bold; text-align: center; color: #1a3a5c; }
.q-opts { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; width: 100%; max-width: 700px; }
.q-btn {
  border: none;
  border-radius: 22px;
  font-size: 36px;
  font-weight: bold;
  padding: 18px 32px;
  cursor: pointer;
  width: 270px;
  height: 106px;
  color: #6a4800;
  background: linear-gradient(180deg, #fff4b0 0%, #ffe050 45%, #f5ad00 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    0 -3px 0 rgba(0,0,0,.2) inset,
    0 6px 0 #b07800,
    0 8px 18px rgba(0,0,0,.3);
  text-shadow: 0 1px 1px rgba(255,255,255,.6);
  transition: transform .1s, box-shadow .1s;
  position: relative;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.q-btn:hover {
  background: linear-gradient(180deg, #fffbc0 0%, #ffe870 45%, #f5b800 100%);
}
.q-btn:active {
  transform: translateY(5px);
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,0,0,.15) inset,
    0 1px 0 #b07800,
    0 3px 8px rgba(0,0,0,.2);
  top: 5px;
}
.q-btn.correct {
  color: #1a5c1a;
  background: linear-gradient(180deg, #e0ffe0 0%, #88e888 45%, #3ab83a 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -3px 0 rgba(0,0,0,.2) inset,
    0 6px 0 #1e7a1e,
    0 8px 18px rgba(0,0,0,.25);
}
.q-btn.wrong {
  color: #7a1010;
  background: linear-gradient(180deg, #ffe0e0 0%, #f08080 45%, #d83030 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -3px 0 rgba(0,0,0,.2) inset,
    0 6px 0 #a02020,
    0 8px 18px rgba(0,0,0,.25);
}
.q-timer { font-size: 16px; color: #888; }
.q-footer { background: #eee; padding: 12px 20px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; flex-shrink: 0; border-top: 1px solid #ddd; }
.btn-footer {
  border: none;
  border-radius: 18px;
  font-size: 18px;
  font-weight: bold;
  padding: 10px 24px;
  cursor: pointer;
  color: #5a4000;
  background: linear-gradient(180deg, #fff4b0 0%, #ffe050 45%, #f5ad00 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -2px 0 rgba(0,0,0,.2) inset,
    0 4px 0 #a07000,
    0 6px 12px rgba(0,0,0,.25);
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
  transition: transform .1s, box-shadow .1s;
  position: relative;
  top: 0;
}
.btn-footer:hover {
  background: linear-gradient(180deg, #fffbc0 0%, #ffe870 45%, #f5b800 100%);
}
.btn-footer:active {
  transform: translateY(3px);
  top: 3px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,0,0,.15) inset,
    0 1px 0 #a07000,
    0 2px 6px rgba(0,0,0,.18);
}
.btn-footer.secondary {
  color: #333;
  background: linear-gradient(180deg, #f8f8f8 0%, #d8d8d8 45%, #b8b8b8 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -2px 0 rgba(0,0,0,.2) inset,
    0 4px 0 #808080,
    0 6px 12px rgba(0,0,0,.22);
  text-shadow: none;
}
.btn-footer.secondary:active {
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,0,0,.15) inset,
    0 1px 0 #808080,
    0 2px 6px rgba(0,0,0,.15);
}
.btn-footer.danger {
  color: #7a1010;
  background: linear-gradient(180deg, #ffe0e0 0%, #f09090 45%, #e05050 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -2px 0 rgba(0,0,0,.2) inset,
    0 4px 0 #a02020,
    0 6px 12px rgba(0,0,0,.25);
  text-shadow: 0 1px 0 rgba(255,255,255,.4);
}
.btn-footer.danger:active {
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,0,0,.15) inset,
    0 1px 0 #a02020,
    0 2px 6px rgba(0,0,0,.18);
}

/* score popup */
.popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; }
.popup-overlay.open { display: flex; }
.popup-box { background: white; border-radius: 20px; padding: 28px 36px; text-align: center; max-width: 90vw; }
.popup-box h3 { font-size: 24px; margin-bottom: 20px; }
.popup-btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.popup-btn {
  border: none;
  border-radius: 18px;
  font-size: 20px;
  font-weight: bold;
  padding: 12px 28px;
  cursor: pointer;
  transition: transform .1s, box-shadow .1s;
  position: relative;
  top: 0;
}
.popup-btn:active {
  transform: translateY(3px);
  top: 3px;
}
.popup-btn.yes {
  color: #5a4000;
  background: linear-gradient(180deg, #fff4b0 0%, #ffe050 45%, #f5ad00 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -2px 0 rgba(0,0,0,.2) inset,
    0 4px 0 #a07000,
    0 6px 14px rgba(0,0,0,.25);
  text-shadow: 0 1px 0 rgba(255,255,255,.5);
}
.popup-btn.yes:active {
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 1px 0 #a07000,
    0 2px 6px rgba(0,0,0,.18);
}
.popup-btn.no {
  color: #333;
  background: linear-gradient(180deg, #f8f8f8 0%, #d8d8d8 45%, #b8b8b8 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.9) inset,
    0 -2px 0 rgba(0,0,0,.2) inset,
    0 4px 0 #808080,
    0 6px 14px rgba(0,0,0,.22);
}
.popup-btn.no:active {
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 1px 0 #808080,
    0 2px 6px rgba(0,0,0,.15);
}

/* shared next btn */
.btn-next {
  border: none;
  border-radius: 24px;
  font-size: 24px;
  font-weight: bold;
  padding: 14px 48px;
  cursor: pointer;
  align-self: center;
  margin-top: 12px;
  color: #5a4000;
  background: linear-gradient(180deg, #fff4b0 0%, #ffe050 45%, #f5ad00 100%);
  box-shadow:
    0 1px 0 rgba(255,255,255,.95) inset,
    0 -4px 0 rgba(0,0,0,.2) inset,
    0 7px 0 #a07000,
    0 10px 20px rgba(0,0,0,.3);
  text-shadow: 0 1px 1px rgba(255,255,255,.6);
  transition: transform .1s, box-shadow .1s;
  position: relative;
  top: 0;
  flex-shrink: 0;
}
.btn-next:hover {
  background: linear-gradient(180deg, #fffbc0 0%, #ffe870 45%, #f5b800 100%);
}
.btn-next:active {
  transform: translateY(5px);
  top: 5px;
  box-shadow:
    0 1px 0 rgba(255,255,255,.7) inset,
    0 -1px 0 rgba(0,0,0,.15) inset,
    0 2px 0 #a07000,
    0 4px 8px rgba(0,0,0,.2);
}
</style>

(function() {
  var strip = document.getElementById('pic-strip');
  var SLICE_W = 190;
  var SLICE_H = 135;
  for (var i = 1; i <= 5; i++) {
    var card = document.createElement('div');
    card.className = 'pic-card';
    card.setAttribute('data-num', i);
    (function(card, num) { card.onclick = function() { togglePic(card, num); }; })(card, i);
    var slice = document.createElement('div');
    slice.className = 'pic-slice';
    slice.style.backgroundImage = "url('" + PICCHOICE_B64 + "')";
    slice.style.backgroundSize = (SLICE_W * 5) + "px " + SLICE_H + "px";
    slice.style.backgroundPosition = "-" + ((i-1)*SLICE_W) + "px 0";
    card.appendChild(slice);
    var numEl = document.createElement('div');
    numEl.className = 'pic-num';
    numEl.textContent = i;
    card.appendChild(numEl);
    var badge = document.createElement('div');
    badge.className = 'badge';
    card.appendChild(badge);
    strip.appendChild(card);
  }
})();

function togglePic(card, num) {
  var idx = picSelected.indexOf(num);
  if (idx >= 0) { picSelected.splice(idx, 1); }
  else { if (picSelected.length >= 2) picSelected.shift(); picSelected.push(num); }
  updatePicDisplay();
}
function updatePicDisplay() {
  document.querySelectorAll('.pic-card').forEach(function(c) {
    c.classList.remove('sel-1','sel-2');
    c.querySelector('.badge').textContent = '';
    c.querySelector('.badge').style.display = '';
  });
  for (var i = 0; i < picSelected.length; i++) {
    var card = document.querySelector('.pic-card[data-num="' + picSelected[i] + '"]');
    if (!card) continue;
    card.classList.add(i === 0 ? 'sel-1' : 'sel-2');
    var b = card.querySelector('.badge');
    b.textContent = i + 1; b.style.display = 'flex';
  }
  var el = document.getElementById('sel-status');
  if (picSelected.length === 0) { el.textContent = 'לא נבחרו תמונות'; el.style.color = '#888'; }
  else if (picSelected.length === 1) { el.textContent = 'נבחרה תמונה ' + picSelected[0] + ' — יש לבחור עוד אחת'; el.style.color = '#e65100'; }
  else { el.textContent = 'נבחרו תמונות ' + picSelected[0] + ' ו-' + picSelected[1] + ' ✓'; el.style.color = '#1b5e20'; }
}

function validateForm(screenId) {
  var ok = true;
  document.querySelectorAll('#' + screenId + ' [data-req]').forEach(function(el) {
    if (!el.value.trim()) { el.classList.add('missing'); ok = false; }
    else el.classList.remove('missing');
  });
  if (!ok) {
    alert('נא למלא את כל השדות המסומנים באדום');
    var first = document.querySelector('#' + screenId + ' .missing');
    if (first) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  return ok;
}

  if (obj && obj.patient) {

// ═══════════════════════════════════════════════════
// BUILD QUESTIONS
// ═══════════════════════════════════════════════════
function buildQuestions() {
  questions = [];
  var origin = P.origin;
  var gender = P.gender;
  var key = origin + '_' + gender;

  // Get name distractors
  var nameDist = NAME_DIST[key] || NAME_DIST['עברי_זכר'];
  var nameOpts = nameDist.opts.slice(); // [correct, d1, d2, d3]
  // replace first with actual name
  var firstCorrect = P.firstName;
  // Make distractors: 3 names from the list that are NOT the correct name
  var nameDists3 = nameOpts.filter(function(n) { return n !== firstCorrect; }).slice(0, 3);

  // Parent distractors
  var parentDist = PARENT_DIST[origin] || PARENT_DIST['עברי'];
  // In this version we collect both names in the form, and decide which one to ask about.
  // The current behavior keeps the existing logic: ask about the opposite parent.
  var parentLabel = gender === 'זכר' ? 'אמא' : 'אבא';
  var parentCorrect = (parentLabel === 'אמא') ? P.motherName : P.fatherName;
  var parentList = (parentLabel === 'אמא') ? parentDist.female : parentDist.male;
  var parentDists3 = parentList.filter(function(n) { return n !== parentCorrect; }).slice(0, 3);

  // ── Q1: שלום ──
  questions.push({
    id: '1.1', section: 'שאלות אוריינטציה', text: 'שלום!',
    opts: shuffle(['כן','שלום', P.gender === 'נקבה' ? 'לא יודעת' : 'לא יודע','להתראות']),
    correct: 'להתראות',
    score2: 2, score1: 1, maxScore: 2,
    repeat: 'שלום!', note: 'תשובה נכונה: להתראות'
  });

  // ── Q2: מה השם שלך ──
  var q2opts = shuffle([firstCorrect].concat(nameDists3));
  questions.push({
    id: '1.2', section: 'שאלות אוריינטציה', text: 'מה השם שלך?',
    opts: q2opts, correct: firstCorrect,
    score2: 2, score1: 1, maxScore: 2,
    repeat: 'מה השם שלך?'
  });

  // ── Q3: שם אב/אם ──
  var q3opts = shuffle([parentCorrect].concat(parentDists3));
  questions.push({
    id: '1.3', section: 'שאלות אוריינטציה', text: 'מה השם של ' + parentLabel + ' שלך?',
    opts: q3opts, correct: parentCorrect,
    score2: 2, score1: 1, maxScore: 2,
    repeat: 'מה השם של ' + parentLabel + ' שלך?'
  });

  // ── Q4: איפה נולדת ──
  var birthCorrect = P.birthCountry;
  var birthDists = ['ישראל','ברית המועצות','עיראק','רומניה','פולין','אוקראינה','מרוקו']
    .filter(function(c){ return c !== birthCorrect; }).slice(0,3);
  var q4opts = shuffle([birthCorrect].concat(birthDists));
  questions.push({
    id: '1.4', section: 'שאלות אוריינטציה', text: 'איפה נולדת?',
    opts: q4opts, correct: birthCorrect,
    score2: 2, score1: 1, maxScore: 2,
    repeat: 'איפה נולדת?'
  });

  // ── Q5: גיל — מרחק עד 10 שנים בלבד ──
  var ageCorrect = P.age;
  var ageDists = [];
  var candidates = [-2,-3,-4,-5,-6,-7,-8,-9,-10,2,3,4,5,6,7,8,9,10];
  // shuffle candidates and pick 3 unique valid ones
  candidates = shuffle(candidates);
  for (var ci = 0; ci < candidates.length && ageDists.length < 3; ci++) {
    var candidate = ageCorrect + candidates[ci];
    if (candidate > 0) ageDists.push(String(candidate));
  }
  var q5opts = shuffle([String(ageCorrect)].concat(ageDists));
  questions.push({
    id: '1.5a', section: 'שאלות אוריינטציה', text: 'מה הגיל שלך?',
    opts: q5opts, correct: String(ageCorrect),
    maxScore: 2,
    repeat: 'מה הגיל שלך?'
  });

  // ── Q6: יש לך ילדים ──
  var hasKids = P.hasChildren === 'כן';
  var q6correct = hasKids ? 'כן' : 'אין לי ילדים';
  questions.push({
    id: '1.5b', section: 'שאלות אוריינטציה', text: 'האם יש לך ילדים?',
    opts: shuffle([q6correct, P.gender === 'נקבה' ? 'לא יודעת' : 'לא יודע','לא זוכר','אולי']),
    correct: q6correct,
    score2: 2, score1: 1, maxScore: 2,
    repeat: 'האם יש לך ילדים?'
  });

  // ── Q7: כמה ילדים (only if has children) ──
  if (hasKids) {
    var childCount = parseInt(P.children) || 0;
    var childCorrect = String(childCount);
    var childDists = ['0','1','2','3','4'].filter(function(c){ return c !== childCorrect; }).slice(0,3);
    var q7opts = shuffle([childCorrect].concat(childDists));
    questions.push({
      id: '1.5c', section: 'שאלות אוריינטציה', text: 'כמה ילדים יש לך?',
      opts: q7opts, correct: childCorrect,
      score2: 2, score1: 1, maxScore: 2,
      repeat: 'כמה ילדים יש לך?'
    });
  }
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

// ═══════════════════════════════════════════════════
// QUESTION DISPLAY
// ═══════════════════════════════════════════════════
function showQuestion(idx) {
  if (idx >= questions.length) { finishAssessment(); return; }
  var q = questions[idx];
  document.getElementById('q-num').textContent = 'שאלה ' + (idx+1) + '/' + questions.length;
  document.getElementById('q-section').textContent = q.section;
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('btn-back').style.display = idx === 0 ? 'none' : '';

  var optsDiv = document.getElementById('q-opts');
  optsDiv.innerHTML = '';
  q.opts.forEach(function(opt) {
    var btn = document.createElement('button');
    btn.className = 'q-btn';
    btn.textContent = opt;
    btn.onclick = function() { selectAnswer(btn, opt, q); };
    optsDiv.appendChild(btn);
  });

  // Read the on-screen question immediately
  speakHebrew(q.text);
  startTimer(q);
}

function selectAnswer(btn, opt, q) {
  clearTimers();
  // Mark correct/wrong visually
  document.querySelectorAll('.q-btn').forEach(function(b) {
    b.classList.remove('correct','wrong');
    if (b.textContent === q.correct) b.classList.add('correct');
    else if (b === btn && opt !== q.correct) b.classList.add('wrong');
  });
  // Automatic scoring: correct=2, wrong=1
  scores[qIndex] = (opt === q.correct) ? q.maxScore : 1;
}

var pendingScore = 0;
function closePopup(giveScore) {
  document.getElementById('popup-score').classList.remove('open');
  scores[qIndex] = giveScore ? 1 : pendingScore;
  // Don't auto-advance; let user press next
}

function startTimer(q) {
  clearTimers();
  timerSecs = 0;
  document.getElementById('q-timer').textContent = '⏱ 0';
  timerInterval = setInterval(function() {
    timerSecs++;
    document.getElementById('q-timer').textContent = '⏱ ' + timerSecs;
    if (timerSecs === 30) {
      // repeat question
      repeatPrompt(q);
    }
  }, 1000);
}
function clearTimers() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}
function repeatPrompt(q) {
  // Repeat the on-screen question text
  if (q && q.text) { speakHebrew(q.text); return; }
  beep();
}

function speakHebrew(text) {
  try {
    if (!('speechSynthesis' in window) || !text) { beep(); return; }
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'he-IL';
    u.rate = 0.95;
    u.pitch = 1;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {
    beep();
  }
}

function beep() {
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = new Ctx();
    var o = ctx.createOscillator();
    var g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = 880;
    g.gain.value = 0.08;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    setTimeout(function() {
      o.stop();
      ctx.close && ctx.close();
    }, 220);
  } catch (e) {}
}

function nextQuestion() {
  clearTimers();
  if (scores[qIndex] === null) scores[qIndex] = 0;
  qIndex++;
  showQuestion(qIndex);
}

function goBack() {
  clearTimers();
  if (qIndex > 0) { qIndex--; showQuestion(qIndex); }
}

function exitAssessment() {
  if (confirm('לצאת מהערכה? ההתקדמות תאבד.')) {
    clearTimers();
    show('s-home');
  }
}

function finishAssessment() {
  clearTimers();
  var total = 0;
  scores.forEach(function(s) { total += (s || 0); });
  saveRecord();
  alert('ההערכה הסתיימה!\nניקוד כולל: ' + total);
  show('s-home');
}

function sanitizeFileName(s) {
  return String(s || '').trim().replace(/[^0-9A-Za-z֐-׿_-]+/g, '_').replace(/_+/g, '_').replace(/^_+|_+$/g, '');
}

function saveRecord() {
  // Ensure we capture the latest patient details before saving
  try { readPatientFromForms(); } catch(e) {}

  var data = { patient: P, scores: scores, timestamp: Date.now() };

  // Save to localStorage history
  var records = [];
  try { records = JSON.parse(localStorage.getItem('hatam_records') || '[]'); } catch(e) {}
  records.unshift(data);
  localStorage.setItem('hatam_records', JSON.stringify(records.slice(0,100)));

  // Download as a JSON file named by participant number
  var base = sanitizeFileName(P.participantId || 'hatam');
  if (!base) base = 'hatam';
  var filename = base + '.json';
  try {
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){
      URL.revokeObjectURL(a.href);
      a.remove();
    }, 400);
  } catch(e) {
    // fallback: do nothing
  }
}

var _fileLoader = document.getElementById('fileLoader');
if (_fileLoader) {
  _fileLoader.addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var obj = JSON.parse(String(r.result || ''));
        handleUploadedRecord(obj);
      } catch(err) {
        alert('לא הצלחתי לקרוא את הקובץ. נא לוודא שזה קובץ JSON שנשמר מהמערכת.');
      }
    };
    r.readAsText(f);
  });
}

document.addEventListener('input', function(e) { if (e.target.classList) e.target.classList.remove('missing'); });
document.addEventListener('change', function(e) { if (e.target.classList) e.target.classList.remove('missing'); });

// ══ PWA: Install prompt banner ══
(function(){
  var deferredPrompt = null;
  var banner = document.createElement('div');
  banner.id = 'pwa-install-banner';
  banner.style.cssText = 'display:none;position:fixed;bottom:0;right:0;left:0;z-index:9999;background:#1a3a5c;color:#fff;padding:14px 20px;flex-direction:row;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -3px 16px rgba(0,0,0,.35);font-family:Arial,sans-serif;font-size:16px;direction:rtl;';
  banner.innerHTML = '<span style="flex:1;font-weight:bold;">&#x1F4F2; הוסף לדף הבית לשימוש כאפליקציה!</span><button id="pwa-install-btn" style="border:none;border-radius:14px;padding:10px 22px;font-size:16px;font-weight:bold;cursor:pointer;background:#ffe050;color:#3a2a00;">התקן</button><button id="pwa-dismiss-btn" style="border:none;background:transparent;color:#aac;font-size:22px;cursor:pointer;padding:0 6px;">&#x2715;</button>';
  document.body.appendChild(banner);
  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    banner.style.display = 'flex';
  });
  document.getElementById('pwa-install-btn').addEventListener('click', function(){
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; banner.style.display = 'none'; });
  });
  document.getElementById('pwa-dismiss-btn').addEventListener('click', function(){
    banner.style.display = 'none';
  });
  window.addEventListener('appinstalled', function(){
    banner.style.display = 'none';
  });
})();
</script>
